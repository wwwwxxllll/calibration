[project]
name = "qcal-qutip-backend"
version = "0.1.0"
description = "QuTiP-backed raw experiment backend for qcal Env"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "qcal-contracts",
    "qutip>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcal_qutip_backend"]

[tool.uv.sources]
qcal-contracts = { workspace = true }
