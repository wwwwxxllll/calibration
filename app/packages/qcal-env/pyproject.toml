[project]
name = "qcal-env"
version = "0.1.0"
description = "Simple Step1/Step2 calibration environment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "qcal-contracts",
    "scipy>=1.11",
]

[project.optional-dependencies]
server = ["uvicorn>=0.30"]
# The official Git repository currently has a broken external ../MengLong
# dependency. README installs star-protocol itself with --no-deps at a pinned
# commit; these are the runtime dependencies needed by its Hub and clients.
star = [
    "psutil>=5.9.0",
    "pyjwt>=2.10.1",
    "rich>=14.1.0",
    "toml>=0.10.2",
    "websockets>=13,<17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcal_env"]

[tool.uv.sources]
qcal-contracts = { workspace = true }
