[project]
name = "qcal-contracts"
version = "0.1.0"
description = "Backend-neutral contracts for quantum calibration experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcal_contracts"]
