[project]
name = "qcal-workspace"
version = "0.3.0"
description = "Workspace for the quantum calibration Env and backend packages"
requires-python = ">=3.13"
dependencies = [
    "menglong",
    "qcal-contracts",
    "qcal-env",
    "qcal-hardware-backend",
    "qcal-qutip-backend",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.uv]
package = false

[tool.uv.sources]
menglong = { git = "https://github.com/GCYYfun/MengLong.git", rev = "fe999c4c56be122072164b0015abf920e476a570" }
qcal-contracts = { workspace = true }
qcal-env = { workspace = true }
qcal-hardware-backend = { workspace = true }
qcal-qutip-backend = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
pythonpath = [
    "packages/qcal-contracts/src",
    "packages/qcal-env/src",
    "packages/qcal-hardware-backend/src",
    "packages/qcal-qutip-backend/src",
]
testpaths = ["tests"]
